<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>📚 Study Planner</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="planner.html">Planner</a>
        <a href="break.html">Break Time</a>
        <a href="tips.html">Tips</a>
    </div>
</nav>

<section class="container">
    <h1>Plan Your Study Day 📖</h1>
    <p>Make a simple plan and complete one task at a time.</p>

    <div class="planner-box">
        <input id="subject" placeholder="Enter subject name">
        <input id="topic" placeholder="Enter topic to study">
        <input id="studyTime" type="time">

        <button onclick="addTask()">Add Task +</button>

        <h2>My Study Tasks</h2>
        <div id="taskList"></div>
        <p id="progress"></p>
    </div>
</section>

<footer>
    Small steps lead to big progress!
</footer>

<script src="script.js"></script>
</body>
</html>
